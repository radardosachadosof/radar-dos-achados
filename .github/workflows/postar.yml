name: Postar achado

on:
  schedule:
    # Horários em UTC. 12,15,18,21,0 UTC = 9h, 12h, 15h, 18h e 21h em Brasília
    - cron: "17 12,15,18,21,0 * * *"
  workflow_dispatch: {}   # permite rodar na mão pelo botão "Run workflow"

permissions:
  contents: write

concurrency:
  group: postar
  cancel-in-progress: false

jobs:
  postar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
      SHOPEE_SECRET: ${{ secrets.SHOPEE_SECRET }}
      IG_TOKEN: ${{ secrets.IG_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
      PINTEREST_REFRESH_TOKEN: ${{ secrets.PINTEREST_REFRESH_TOKEN }}
      PINTEREST_APP_ID: ${{ secrets.PINTEREST_APP_ID }}
      PINTEREST_APP_SECRET: ${{ secrets.PINTEREST_APP_SECRET }}
      DRY_RUN: ${{ vars.DRY_RUN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Baixar fonte Poppins
        run: |
          mkdir -p fontes
          for w in Regular Bold ExtraBold; do
            [ -f fontes/Poppins-$w.ttf ] || curl -sSfL -o fontes/Poppins-$w.ttf \
              "https://github.com/google/fonts/raw/main/ofl/poppins/Poppins-$w.ttf" || true
          done

      - name: Preparar oferta (busca + arte + vitrine)
        run: python radar.py preparar

      - name: Salvar no repositório
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add docs data
          git diff --cached --quiet || (git commit -m "Novo achado" && git push)

      - name: Esperar a imagem ficar pública
        run: sleep 25

      - name: Publicar no Instagram / Pinterest
        run: python radar.py publicar

      - name: Salvar resultado
        if: always()
        run: |
          git add data docs
          git diff --cached --quiet || (git commit -m "Resultado da publicação" && git push)
